<svg width="500" height="350" viewBox="0 0 500 350" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="500" height="350" fill="#f8f9fa"/>
  
  <!-- City silhouette -->
  <rect x="0" y="200" width="500" height="150" fill="#2c3e50"/>
  
  <!-- Buildings -->
  <rect x="50" y="150" width="60" height="50" fill="#34495e"/>
  <rect x="130" y="120" width="80" height="80" fill="#34495e"/>
  <rect x="230" y="140" width="70" height="60" fill="#34495e"/>
  <rect x="320" y="110" width="90" height="90" fill="#34495e"/>
  <rect x="430" y="160" width="50" height="40" fill="#34495e"/>
  
  <!-- Windows -->
  <g fill="#ffc107">
    <rect x="60" y="160" width="8" height="10" rx="1"/>
    <rect x="75" y="160" width="8" height="10" rx="1"/>
    <rect x="90" y="160" width="8" height="10" rx="1"/>
    
    <rect x="145" y="135" width="8" height="10" rx="1"/>
    <rect x="160" y="135" width="8" height="10" rx="1"/>
    <rect x="175" y="135" width="8" height="10" rx="1"/>
    <rect x="190" y="135" width="8" height="10" rx="1"/>
    
    <rect x="245" y="155" width="8" height="10" rx="1"/>
    <rect x="260" y="155" width="8" height="10" rx="1"/>
    <rect x="275" y="155" width="8" height="10" rx="1"/>
    
    <rect x="340" y="125" width="8" height="10" rx="1"/>
    <rect x="355" y="125" width="8" height="10" rx="1"/>
    <rect x="370" y="125" width="8" height="10" rx="1"/>
    <rect x="385" y="125" width="8" height="10" rx="1"/>
    
    <rect x="440" y="170" width="8" height="10" rx="1"/>
    <rect x="455" y="170" width="8" height="10" rx="1"/>
  </g>
  
  <!-- People silhouettes -->
  <g fill="#4a90e2" opacity="0.8">
    <!-- Person 1 -->
    <circle cx="150" cy="250" r="15"/>
    <rect x="140" y="265" width="20" height="40" rx="10"/>
    <rect x="135" y="280" width="8" height="25" rx="4"/>
    <rect x="157" y="280" width="8" height="25" rx="4"/>
    
    <!-- Person 2 -->
    <circle cx="200" cy="250" r="15"/>
    <rect x="190" y="265" width="20" height="40" rx="10"/>
    <rect x="185" y="280" width="8" height="25" rx="4"/>
    <rect x="207" y="280" width="8" height="25" rx="4"/>
    
    <!-- Person 3 -->
    <circle cx="350" cy="250" r="15"/>
    <rect x="340" y="265" width="20" height="40" rx="10"/>
    <rect x="335" y="280" width="8" height="25" rx="4"/>
    <rect x="357" y="280" width="8" height="25" rx="4"/>
  </g>
  
  <!-- Helping hands/hearts -->
  <g fill="#ff8c42" opacity="0.7">
    <path d="M100,100 C100,100 90,90 90,83 C90,77 95,75 100,80 C105,75 110,77 110,83 C110,90 100,100 100,100 Z"/>
    <path d="M250,80 C250,80 240,70 240,63 C240,57 245,55 250,60 C255,55 260,57 260,63 C260,70 250,80 250,80 Z"/>
    <path d="M400,90 C400,90 390,80 390,73 C390,67 395,65 400,70 C405,65 410,67 410,73 C410,80 400,90 400,90 Z"/>
  </g>
  
  <!-- Snow effect -->
  <g fill="white" opacity="0.6">
    <circle cx="80" cy="50" r="2"/>
    <circle cx="150" cy="30" r="1.5"/>
    <circle cx="220" cy="70" r="2"/>
    <circle cx="300" cy="40" r="1"/>
    <circle cx="380" cy="60" r="1.5"/>
    <circle cx="450" cy="35" r="2"/>
    <circle cx="120" cy="90" r="1"/>
    <circle cx="280" cy="20" r="1.5"/>
    <circle cx="420" cy="80" r="1"/>
    <circle cx="180" cy="110" r="2"/>
  </g>
  
  <!-- Text overlay -->
  <text x="250" y="330" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="white" text-anchor="middle">
    Gemeinsam helfen
  </text>
</svg>