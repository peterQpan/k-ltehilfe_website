baseURL = 'https://ingos-kleine-kaeltehilfe-saarbruecken.de'
languageCode = 'de-de'
title = 'Ingos kleine Kältehilfe – Hand in Hand e.V.'
enableRobotsTXT = true
enableEmoji = true

# URL-Konfiguration für bessere Tag-URLs
removePathAccents = true
disablePathToLower = false

# Taxonomy-Konfiguration
[taxonomies]
  tag = "tags"
  category = "categories"

[permalinks]
  tags = "/tags/:slug/"
  categories = "/categories/:slug/"

# SEO Optimierungen
[params]
