  newsletter_enabled = false

# RSS/XML Feed Konfiguration
[services]
  [services.rss]
    limit = 20  # Anzahl der Artikel im RSS-Feed

# Sitemap Konfiguration
[sitemap]
  changefreq = "monthly"
  priority = 0.5
  filename = "sitemap.xml"

# Minifizierung für bessere Performance
[minify]
  [minify.tdewolff]
    [minify.tdewolff.html]
      keepDocumentTags = true
      keepEndTags = true
      keepDefaultAttrVals = true
      keepWhitespace = false
    [minify.tdewolff.css]
      keepCSS2 = true
      precision = 0
    [minify.tdewolff.js]
      keepVarNames = false
      precision = 0

[markup]
  [markup.goldmark.renderer]
    unsafe = true
  [markup.tableOfContents]
    startLevel = 2
    endLevel = 3
