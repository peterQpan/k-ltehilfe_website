{{ define "main" }}
<section class="news-section section-padding">
  <div class="container">
    <div class="row">
      <div class="col-12 mb-5">
        <h2>{{ .Title }}</h2>
      </div>
      <div class="col-12">
        <ul class="list-unstyled">
          {{ range .Pages }}
          <li><a href="{{ .RelPermalink }}">{{ .Title }}</a></li>
          {{ end }}
        </ul>
      </div>
    </div>
  </div>
</section>
{{ end }}
