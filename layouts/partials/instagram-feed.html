<section class="testimonial-section section-padding section-bg">
  <div class="container">
    <div class="row">
      <div class="col-12 mx-auto">
        <h2 class="mb-lg-3 text-center">Instagram</h2>
        <div id="instagram-feed" class="row justify-content-center"></div>
      </div>
    </div>
  </div>
</section>
<script>
  document.addEventListener('DOMContentLoaded', function () {
    const feed = document.getElementById('instagram-feed');
    fetch('/instagram.php')
      .then((response) => response.json())
      .then((urls) => {
        urls.slice(0, 12).forEach((imgUrl) => {
          const col = document.createElement('div');
          col.className = 'col-lg-3 col-md-4 col-6 p-2';
          
          const img = document.createElement('img');
          // Verwende den Image-Proxy um CORS-Probleme zu umgehen
          img.src = '/image_proxy.php?url=' + encodeURIComponent(imgUrl);
          img.alt = 'Instagram Post von Ingos kleine Kältehilfe';
          img.className = 'img-fluid rounded shadow-sm instagram-img';
          img.style.cursor = 'pointer';
          img.style.transition = 'transform 0.3s ease, box-shadow 0.3s ease';
          
          // Hover-Effekt
          img.addEventListener('mouseenter', function() {
            img.style.transform = 'scale(1.05)';
            img.style.boxShadow = '0 8px 25px rgba(0,0,0,0.3)';
          });
          
          img.addEventListener('mouseleave', function() {
            img.style.transform = 'scale(1)';
            img.style.boxShadow = '';
          });
          
          // Optional: Klick öffnet Instagram-Post (falls gewünscht)
          img.addEventListener('click', function() {
            window.open('https://instagram.com/ingoskleinekaeltehilfe', '_blank');
          });
          
          col.appendChild(img);
          feed.appendChild(col);
        });
      })
      .catch((err) => {
        console.error('Failed to load Instagram images', err);
        // Fallback-Nachricht falls API nicht funktioniert
        feed.innerHTML = '<div class="col-12 text-center"><p class="text-muted">Instagram-Bilder konnten nicht geladen werden.</p></div>';
      });
  });
</script>
