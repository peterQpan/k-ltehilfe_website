<section class="contact-section section-padding" id="section_6">
    <div class="container">
        <div class="row">

            <div class="col-lg-4 col-12 ms-auto mb-5 mb-lg-0">
                    <div class="contact-info-wrap">
                        <h2>Kontakt aufnehmen</h2>

                        <div class="contact-info">
                            <h5 class="mb-3">Kontaktinformationen</h5>

                            <p class="d-flex mb-2">
                                <i class="bi-geo-alt me-2"></i>
                                Stengelstr. 30, 66117 Saarbrücken
                            </p>

                            <p class="d-flex mb-2">
                                <i class="bi-telephone me-2"></i>
                                <a href="tel:+491749117841">+49 174 9117841</a>
                            </p>

                            <p class="d-flex">
                                <i class="bi-envelope me-2"></i>
                                <a href="mailto:hand-in-hand@gmx.de">hand-in-hand@gmx.de</a>
                            </p>

                            <a href="https://www.google.com/maps?q=Stengelstr.+30,+66117+Saarbrücken" class="custom-btn btn mt-3" target="_blank">Anfahrt</a>
                        </div>
                    </div>
            </div>

            <div class="col-lg-5 col-12 mx-auto">
                <form class="custom-form contact-form" id="contactForm" method="post" role="form">
                    <h2>Kontaktformular</h2>
                    <p class="mb-4">Oder schick uns eine E-Mail:
                        <a href="mailto:hand-in-hand@gmx.de">hand-in-hand@gmx.de</a>
                    </p>
                    <div class="row">
                        <div class="col-12">
                            <input type="text" name="first-name" id="first-name" class="form-control" placeholder="Vorname" required>
                        </div>
                    </div>
                    <input type="email" name="email" id="email" pattern="[^ @]*@[^ @]*" class="form-control" placeholder="max@example.de" required>
                    <textarea name="message" rows="5" class="form-control" id="message" placeholder="Wie können wir helfen?"></textarea>
                    <button type="submit" class="form-control">Nachricht senden</button>
                </form>
                <div id="contactOverlay" style="display:none;position:fixed;top:0;left:0;width:100vw;height:100vh;background:rgba(76,175,80,0.95);z-index:9999;align-items:center;justify-content:center;text-align:center;">
                    <div style="margin:auto;padding:2em;background:#fff;border-radius:10px;max-width:400px;box-shadow:0 2px 8px rgba(0,0,0,0.2);color:#333;">
                        <h4 style="color:#4caf50;">Vielen Dank für deine Nachricht!</h4>
                        <p>Wir melden uns so schnell wie möglich.</p>
                        <button onclick="document.getElementById('contactOverlay').style.display='none'" class="form-control" style="background:#4caf50;color:#fff;">Schließen</button>
                    </div>
                </div>
                <script>
                document.getElementById('contactForm').addEventListener('submit', function(e) {
                    e.preventDefault();
                    const form = e.target;
                    const data = new FormData(form);
                    fetch('/mail_secure.php', {
                        method: 'POST',
                        body: data
                    })
                    .then(response => {
                        if (!response.ok) throw new Error('Network response was not ok');
                        return response.text();
                    })
                    .then(() => {
                        document.getElementById('contactOverlay').style.display = 'flex';
                        form.reset();
                    })
                    .catch(() => {
                        alert('Fehler beim Senden. Bitte versuche es später erneut.');
                    });
                });
                </script>
            </div>

        </div>
    </div>
</section>
