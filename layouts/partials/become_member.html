<section class="volunteer-section section-padding" id="section_4">
    <div class="container">
        <div class="row">

            <div class="col-lg-6 col-12">
                    <h2 class="text-white mb-4">Mithelfen</h2>

                <form class="custom-form volunteer-form mb-5 mb-lg-0" action="#" method="post" role="form">
                    <h3 class="mb-4">Werde heute ehrenamtlich tätig</h3>

                    <div class="row">
                        <div class="col-lg-6 col-12">
                            <input type="text" name="volunteer-name" id="volunteer-name" class="form-control" placeholder="Max Mustermann" required>
                        </div>

                        <div class="col-lg-6 col-12">    
                            <input type="email" name="volunteer-email" id="volunteer-email" pattern="[^ @]*@[^ @]*" class="form-control" placeholder="max@example.de" required>
                        </div>

                        <div class="col-lg-6 col-12">
                            <input type="text" name="volunteer-subject" id="volunteer-subject" class="form-control" placeholder="Betreff" required>
                        </div>

                        <div class="col-lg-6 col-12">
                            <div class="input-group input-group-file">
                                <input type="file" class="form-control" id="inputGroupFile02">
                                
                                <label class="input-group-text" for="inputGroupFile02">Lade deinen Lebenslauf hoch</label>

                                <i class="bi-cloud-arrow-up ms-auto"></i>
                            </div>
                        </div>
                    </div>

                    <textarea name="volunteer-message" rows="3" class="form-control" id="volunteer-message" placeholder="Kommentar (optional)"></textarea>

                    <button type="submit" class="form-control">Absenden</button>
                </form>
            </div>

            <div class="col-lg-6 col-12">
                <img src="images/smiling-casual-woman-dressed-volunteer-t-shirt-with-badge.jpg" class="volunteer-image img-fluid" alt="">

                    <div class="custom-block-body text-center">
                        <h4 class="text-white mt-lg-3 mb-lg-3">Über das Ehrenamt</h4>

                        <p class="text-white">Engagiere dich in unserem Team und unterstütze Menschen in Not.</p>
                    </div>
            </div>

        </div>
    </div>
</section>
