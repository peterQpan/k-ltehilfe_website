<section class="news-section section-padding" id="section_5">
    <div class="container">
        <div class="row">
            <div class="col-lg-12 col-12 mb-5">
                <h2>Aktuelles</h2>
            </div>
            {{ $posts := first 4 (where .Site.RegularPages "Section" "aktuelles") }}
            {{ range $posts }}
            <div class="col-lg-6 col-12 mb-4">
                <div class="news-block">
                    <div class="news-block-top">
                        <a href="{{ .RelPermalink }}">
                            {{ with .Params.image }}
                            <img src="{{ . | relURL }}" class="news-image img-fluid" alt="">
                            {{ end }}
                        </a>
                    </div>
                    <div class="news-block-info">
                        <div class="news-block-title mb-2">
                            <h4><a href="{{ .RelPermalink }}" class="news-block-title-link">{{ .Title }}</a></h4>
                        </div>
                        <div class="news-block-date">
                            <p>
                                <i class="bi-calendar4 custom-icon me-1"></i>{{ .Date.Format "02. January 2006" }}
                            </p>
                        </div>
                        <div class="news-block-body">
                            <p>{{ .Summary }}</p>
                        </div>
                    </div>
                </div>
            </div>
            {{ end }}
        </div>
    </div>
</section>
