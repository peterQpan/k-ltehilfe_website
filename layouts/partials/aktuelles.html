<section class="news-section section-padding" id="section_5">
    <div class="container">
        <div class="row">
            <div class="col-lg-12 col-12 mb-5">
                <h2>Aktuelles</h2>
            </div>
            {{ range first 4 ( where site.RegularPages "Section" "aktuelles" ) }}
            <div class="col-lg-6 col-12 mb-4">
                <div class="news-block">
                    <div class="news-block-top">
                        <a href="{{ .RelPermalink }}">
                            {{ with .Params.image }}<img src="{{ . }}" class="news-image img-fluid" alt="">{{ end }}
                        </a>
                        <div class="news-category-block">
                            {{ range .Params.tags }}<span class="category-block-link">{{ . }}</span>{{ end }}
                        </div>
                    </div>
                    <div class="news-block-info">
                        <div class="news-block-title mb-2">
                            <h4><a href="{{ .RelPermalink }}" class="news-block-title-link">{{ .Title }}</a></h4>
                        </div>
                        <div class="news-block-body">
                            {{ with .Summary }}<p>{{ . }}</p>{{ end }}
                        </div>
                    </div>
                </div>
            </div>
            {{ end }}
        </div>
    </div>
</section>
