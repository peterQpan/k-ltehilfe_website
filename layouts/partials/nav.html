<div class="redirect-card">
    <img src="/logo.svg" alt="Ingos kleine Kältehilfe Logo" class="logo">
    <h1>Willkommen!</h1>
    <p class="redirect-text">
        Sie werden in <span class="countdown" id="countdown">3</span> Sekunden automatisch zur Hauptwebseite weitergeleitet.
    </p>
    <div>
        <a href="charity_o/" class="direct-link">Sofort zur Hauptseite</a>
        <a href="#overview" class="direct-link alt-link">Alle Versionen anzeigen</a>
    </div>
</div>
<script>
    let seconds = 3;
    const countdownElement = document.getElementById('countdown');
    const timer = setInterval(() => {
        seconds--;
        countdownElement.textContent = seconds;
        if (seconds <= 0) {
            clearInterval(timer);
            window.location.href = 'charity_o/';
        }
    }, 1000);
</script>
