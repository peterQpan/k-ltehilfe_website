<section class="testimonial-section section-padding section-bg" id="section_ig">
    <div class="container">
        <div class="row">
            <div class="col-lg-8 col-12 mx-auto text-center">
                <h2 class="mb-lg-3">Instagram Feed</h2>
                <div class="row g-2" id="instagram-feed"></div>
            </div>
        </div>
    </div>
    <script>
    document.addEventListener('DOMContentLoaded', function () {
        const user = 'ingoskleinekaeltehilfe';
        const feedEl = document.getElementById('instagram-feed');
        fetch(`https://www.instagram.com/${user}/?__a=1&__d=dis`)
            .then(res => res.json())
            .then(data => {
                const edges = data?.graphql?.user?.edge_owner_to_timeline_media?.edges || [];
                edges.slice(0, 9).forEach(edge => {
                    const url = edge.node.thumbnail_src || edge.node.display_url;
                    const link = `https://www.instagram.com/p/${edge.node.shortcode}/`;
                    const col = document.createElement('div');
                    col.className = 'col-lg-4 col-md-4 col-6';
                    const a = document.createElement('a');
                    a.href = link;
                    a.target = '_blank';
                    a.rel = 'noopener';
                    const img = document.createElement('img');
                    img.src = url;
                    img.alt = 'Instagram image';
                    img.className = 'img-fluid w-100';
                    a.appendChild(img);
                    col.appendChild(a);
                    feedEl.appendChild(col);
                });
            })
            .catch(err => {
                console.error('Instagram feed error', err);
                feedEl.innerHTML = '<p class="text-muted">Instagram Feed konnte nicht geladen werden.</p>';
            });
    });
    </script>
</section>
